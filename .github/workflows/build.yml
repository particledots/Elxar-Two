name: Build plugin (macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build-macos:
    runs-on: macos-26     # Apple silicon runner, same as the Beads workflow
    steps:
      - uses: actions/checkout@v4

      - name: Configure (universal, macOS 11+)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Engine test (headless: renders drum hits to WAV and checks them)
        run: |
          cmake --build build --target engine_test -j4 > engine_log.txt 2>&1 || {
            grep -E "error|Error" engine_log.txt | head -8 | while IFS= read -r line; do echo "::error::ENGINE BUILD: $line"; done
            tail -20 engine_log.txt; exit 1; }
          mkdir -p test-renders/apple-silicon test-renders/intel
          # Apple silicon half of the universal binary: must pass.
          arch -arm64 build/engine_test test-renders/apple-silicon 48000 | tee engine_result.txt
          grep -q "RESULT: all checks passed" engine_result.txt || { grep FAIL engine_result.txt | while IFS= read -r line; do echo "::error::ENGINE TEST: $line"; done; exit 1; }
          # Intel half, run through Rosetta when the runner has it. Reported, but does not stop the build.
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 build/engine_test test-renders/intel 48000 > engine_result_intel.txt 2>&1 || true
            tail -3 engine_result_intel.txt
            grep -q "RESULT: all checks passed" engine_result_intel.txt && echo "::notice::ENGINE TEST intel (Rosetta): all checks passed" || echo "::warning::ENGINE TEST intel (Rosetta): did not pass: $(tail -1 engine_result_intel.txt)"
          else
            echo "::notice::ENGINE TEST intel: Rosetta not available on this runner, skipped"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ELXAR-Two-test-renders
          path: test-renders

      - name: Build AU + VST3
        run: |
          # Compiler errors are also written as annotations (shown on the run page and readable through the API).
          cmake --build build --target ELXAR_Two_AU ELXAR_Two_VST3 -j4 > build_log.txt 2>&1 || {
            grep -E "error|Error" build_log.txt | head -8 | while IFS= read -r line; do echo "::error::BUILD: $line"; done
            tail -20 build_log.txt; exit 1; }
          tail -3 build_log.txt

      - name: Ad-hoc sign (lets Apple silicon load an unsigned build)
        run: |
          for b in build/ELXAR_Two_artefacts/Release/AU/*.component build/ELXAR_Two_artefacts/Release/VST3/*.vst3; do
            codesign --force --deep -s - "$b"
          done

      - name: Package
        run: |
          mkdir -p dist
          cp -R build/ELXAR_Two_artefacts/Release/AU/*.component dist/
          cp -R build/ELXAR_Two_artefacts/Release/VST3/*.vst3 dist/
          cp THIRD-PARTY-LICENSES.txt LICENSE dist/
          cp third_party/lxr-firmware/NOTICE.md dist/NOTICE-LXR-firmware.md
          cp third_party/lxr-firmware/ELXAR-CHANGES.md dist/CHANGES-to-LXR-firmware.md
          # Both slices present, and the minimum macOS version baked into each (should say 11.0):
          lipo -archs dist/*.component/Contents/MacOS/*
          lipo -archs dist/*.vst3/Contents/MacOS/*
          for a in arm64 x86_64; do echo "== $a"; lipo -thin $a dist/*.component/Contents/MacOS/* -output /tmp/slice_$a; otool -l /tmp/slice_$a | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | grep -E "minos|version"; done
          cp tools/install/Install-ELXAR-Two.command tools/install/Uninstall-ELXAR-Two.command dist/
          chmod +x dist/Install-ELXAR-Two.command dist/Uninstall-ELXAR-Two.command
          cat > dist/INSTALL.txt <<'TXT'
          EASY INSTALL (AU for Logic, plus VST3): double-click Install-ELXAR-Two.command in this folder.
          It asks for your Mac password once. To remove: double-click Uninstall-ELXAR-Two.command.

          Then in Logic: Settings > Plug-in Manager > Reset & Rescan Selection.
          Look for "particledots: ELXAR-Two" as an Instrument (software instrument slot).

          Manual install instead: copy ELXAR-Two.component to /Library/Audio/Plug-Ins/Components/
          and ELXAR-Two.vst3 to /Library/Audio/Plug-Ins/VST3/.
          If macOS says it is from an unidentified developer: Terminal, then
            xattr -dr com.apple.quarantine <the unzipped folder>
          TXT
          [ -x dist/Install-ELXAR-Two.command ] || { echo "::error::PACKAGE missing Install-ELXAR-Two.command"; exit 1; }
          ditto -c -k --keepParent dist ELXAR-Two-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ELXAR-Two-macOS
          path: ELXAR-Two-macOS.zip
